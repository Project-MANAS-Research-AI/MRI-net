name: "Tests"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync
      - name: Run smoke test
        run: uv run pytest tests/test_smoke.py -v
      - name: Run bug tests
        run: uv run pytest tests/test_bugs.py -v